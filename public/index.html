<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucid Logic Intelligence OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="mark">LL</div><div><strong>LUCID LOGIC</strong><span>INTELLIGENCE OS</span></div></div>
    <nav>
      <button class="nav active" data-view="overview">⌂ <span>Command Center</span></button>
      <button class="nav" data-view="clients">◫ <span>Clients</span></button>
      <button class="nav" data-view="signals">◉ <span>Signals</span></button>
      <button class="nav" data-view="actions">✓ <span>Action Queue</span></button>
      <button class="nav" data-view="programs">⌁ <span>Intel Programs</span></button>
      <button class="nav" data-view="connectors">↗ <span>Connectors</span></button>
      <button class="nav" data-view="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="sidebar-note"><b>Managed intelligence</b><p>Watch what matters. Explain why. Act on it.</p></div>
  </aside>
  <main>
    <header class="topbar">
      <div><p class="eyebrow">LUCID LOGIC / MANAGED INTELLIGENCE</p><h1 id="pageTitle">Command Center</h1></div>
      <div class="top-actions"><select id="clientSelect" class="client-select" aria-label="Current client"></select><span id="aiBadge" class="badge">Checking AI...</span><button class="btn" id="refreshBtn">Refresh</button><button class="btn gold" id="newClientBtn">+ Add Client</button></div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-x" id="modalClose">×</button><div id="modalBody"></div></div></div>
<div id="toast"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
